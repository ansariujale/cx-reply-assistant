<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <text x="40" y="36" font-size="20" font-weight="700" fill="#0f172a">CX Reply Assistant at scale: 500 brands, 5,000 agents, millions of messages</text>
  <text x="40" y="58" font-size="12" fill="#334155">Brand is decided when a message arrives. Knowledge is retrieved for one brand only. The model is checked in code. A human approves every send.</text>

  <!-- Lane 1: channels -->
  <rect x="40" y="80" width="1200" height="84" fill="#f8fafc" stroke="#e2e8f0" rx="12"/>
  <text x="56" y="100" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">CHANNELS AND OTHER SYSTEMS</text>
  <rect x="60" y="110" width="220" height="42" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2" rx="10"/>
  <text x="72" y="136" font-size="14" font-weight="700" fill="#0f172a">WhatsApp (Meta API)</text>
  <rect x="300" y="110" width="200" height="42" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2" rx="10"/>
  <text x="312" y="136" font-size="14" font-weight="700" fill="#0f172a">Email and web chat</text>
  <rect x="520" y="110" width="240" height="42" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2" rx="10"/>
  <text x="532" y="136" font-size="14" font-weight="700" fill="#0f172a">Order / CRM systems</text>
  <rect x="780" y="110" width="220" height="42" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2" rx="10"/>
  <text x="792" y="136" font-size="14" font-weight="700" fill="#0f172a">LLM providers (OpenRouter)</text>
  <rect x="1020" y="110" width="200" height="42" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2" rx="10"/>
  <text x="1032" y="136" font-size="14" font-weight="700" fill="#0f172a">Agents (browser)</text>

  <!-- Lane 2: incoming messages -->
  <rect x="40" y="184" width="1200" height="124" fill="#f8fafc" stroke="#e2e8f0" rx="12"/>
  <text x="56" y="204" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">INCOMING MESSAGES</text>
  <rect x="60" y="216" width="260" height="78" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="72" y="238" font-size="14" font-weight="700" fill="#0f172a">Webhook receiver</text>
  <text x="72" y="256" font-size="12" fill="#334155">checks the signature, makes an</text>
  <text x="72" y="272" font-size="12" fill="#334155">idempotency key, puts the event</text>
  <text x="72" y="288" font-size="12" fill="#334155">on the queue, answers 200 quickly</text>

  <rect x="360" y="216" width="200" height="78" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="372" y="238" font-size="14" font-weight="700" fill="#0f172a">Queue</text>
  <text x="372" y="256" font-size="12" fill="#334155">Redis Streams / SQS / pgmq</text>
  <text x="372" y="272" font-size="12" fill="#334155">retries and a dead-letter queue</text>
  <text x="372" y="288" font-size="12" fill="#334155">fair share per brand</text>

  <rect x="600" y="216" width="300" height="78" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="612" y="238" font-size="14" font-weight="700" fill="#0f172a">Ingest worker</text>
  <text x="612" y="256" font-size="12" fill="#334155">skips duplicates (processed_events)</text>
  <text x="612" y="272" font-size="12" fill="#334155">finds the brand from the number / inbox</text>
  <text x="612" y="288" font-size="12" fill="#334155">saves customer, conversation, message</text>

  <rect x="940" y="216" width="280" height="78" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="952" y="238" font-size="14" font-weight="700" fill="#0f172a">Agent app (React / Next.js)</text>
  <text x="952" y="256" font-size="12" fill="#334155">Supabase Auth: token has the</text>
  <text x="952" y="272" font-size="12" fill="#334155">agent's brands and role</text>
  <text x="952" y="288" font-size="12" fill="#334155">inbox, conversation, draft panel, KB, logs</text>

  <!-- Lane 3: API and AI -->
  <rect x="40" y="328" width="1200" height="190" fill="#f8fafc" stroke="#e2e8f0" rx="12"/>
  <text x="56" y="348" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">API AND AI</text>

  <rect x="60" y="360" width="280" height="140" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="72" y="382" font-size="14" font-weight="700" fill="#0f172a">Conversation API</text>
  <text x="72" y="400" font-size="12" fill="#334155">Next.js routes + Supabase RPC</text>
  <text x="72" y="416" font-size="12" fill="#334155">every query filtered by the</text>
  <text x="72" y="432" font-size="12" fill="#334155">brands in the token</text>
  <text x="72" y="448" font-size="12" fill="#334155">rate limits per agent and brand</text>
  <text x="72" y="464" font-size="12" fill="#334155">approve = save message + outbox</text>
  <text x="72" y="480" font-size="12" fill="#334155">row in one transaction</text>

  <rect x="380" y="360" width="320" height="140" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.2" rx="10"/>
  <text x="392" y="382" font-size="14" font-weight="700" fill="#0f172a">Reply worker (same pipeline as the app)</text>
  <text x="392" y="402" font-size="12" fill="#334155">1. brand from the conversation, never from text</text>
  <text x="392" y="418" font-size="12" fill="#334155">2. retrieve that brand's knowledge: found / weak / none</text>
  <text x="392" y="434" font-size="12" fill="#334155">3. prompt: order facts, last messages, chunks with ids</text>
  <text x="392" y="450" font-size="12" fill="#334155">4. model call through the gateway (JSON output)</text>
  <text x="392" y="466" font-size="12" fill="#334155">5. guardrails in code: numbers, policy windows, promises</text>
  <text x="392" y="482" font-size="12" fill="#334155">6. save the draft with everything it used; agent approves</text>

  <rect x="740" y="360" width="230" height="140" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.2" rx="10"/>
  <text x="752" y="382" font-size="14" font-weight="700" fill="#0f172a">Retrieval service</text>
  <text x="752" y="402" font-size="12" fill="#334155">keywords (Postgres) + embeddings</text>
  <text x="752" y="418" font-size="12" fill="#334155">Qdrant: one collection per brand</text>
  <text x="752" y="434" font-size="12" fill="#334155">plus a brand_id filter</text>
  <text x="752" y="450" font-size="12" fill="#334155">chunks of a few hundred tokens</text>
  <text x="752" y="466" font-size="12" fill="#334155">top 3 to 5 with scores and ids</text>
  <text x="752" y="482" font-size="12" fill="#334155">tested with a per-brand question set</text>

  <rect x="1010" y="360" width="210" height="140" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.2" rx="10"/>
  <text x="1022" y="382" font-size="14" font-weight="700" fill="#0f172a">Model gateway</text>
  <text x="1022" y="402" font-size="12" fill="#334155">OpenRouter behind it</text>
  <text x="1022" y="418" font-size="12" fill="#334155">cheap model by default,</text>
  <text x="1022" y="434" font-size="12" fill="#334155">stronger only when flagged</text>
  <text x="1022" y="450" font-size="12" fill="#334155">fallbacks, timeouts, token limits</text>
  <text x="1022" y="466" font-size="12" fill="#334155">prompt caching, prompt versions</text>
  <text x="1022" y="482" font-size="12" fill="#334155">cost recorded per brand and model</text>

  <!-- Lane 4: data -->
  <rect x="40" y="538" width="1200" height="124" fill="#f8fafc" stroke="#e2e8f0" rx="12"/>
  <text x="56" y="558" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">DATA (every brand-owned row has brand_id)</text>

  <rect x="60" y="570" width="380" height="78" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" rx="10"/>
  <text x="72" y="592" font-size="14" font-weight="700" fill="#0f172a">PostgreSQL (Supabase)</text>
  <text x="72" y="610" font-size="12" fill="#334155">Row Level Security on brand_id</text>
  <text x="72" y="626" font-size="12" fill="#334155">brands, customers, conversations, messages, kb_entries,</text>
  <text x="72" y="642" font-size="12" fill="#334155">ai_generations, processed_events, outbox; big tables by month</text>

  <rect x="480" y="570" width="220" height="78" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" rx="10"/>
  <text x="492" y="592" font-size="14" font-weight="700" fill="#0f172a">Qdrant</text>
  <text x="492" y="610" font-size="12" fill="#334155">knowledge embeddings</text>
  <text x="492" y="626" font-size="12" fill="#334155">one collection per brand</text>
  <text x="492" y="642" font-size="12" fill="#334155">rebuilt when an entry is saved</text>

  <rect x="740" y="570" width="220" height="78" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" rx="10"/>
  <text x="752" y="592" font-size="14" font-weight="700" fill="#0f172a">Redis</text>
  <text x="752" y="610" font-size="12" fill="#334155">duplicate webhook keys</text>
  <text x="752" y="626" font-size="12" fill="#334155">rate limits and quotas</text>
  <text x="752" y="642" font-size="12" fill="#334155">cache for hot knowledge and orders</text>

  <rect x="1000" y="570" width="220" height="78" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.2" rx="10"/>
  <text x="1012" y="592" font-size="14" font-weight="700" fill="#0f172a">Secrets and storage</text>
  <text x="1012" y="610" font-size="12" fill="#334155">per-brand channel credentials</text>
  <text x="1012" y="626" font-size="12" fill="#334155">LLM keys with spend limits</text>
  <text x="1012" y="642" font-size="12" fill="#334155">attachments and photos</text>

  <!-- Lane 5: sending, jobs, monitoring -->
  <rect x="40" y="682" width="1200" height="150" fill="#f8fafc" stroke="#e2e8f0" rx="12"/>
  <text x="56" y="702" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">SENDING, BACKGROUND JOBS, MONITORING</text>

  <rect x="60" y="714" width="380" height="104" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="72" y="736" font-size="14" font-weight="700" fill="#0f172a">Outbox and sending worker</text>
  <text x="72" y="756" font-size="12" fill="#334155">reads outbox rows written when the agent approved</text>
  <text x="72" y="772" font-size="12" fill="#334155">sends with the provider's idempotency key: exactly once</text>
  <text x="72" y="788" font-size="12" fill="#334155">retries with backoff, dead-letter queue and alert</text>
  <text x="72" y="804" font-size="12" fill="#334155">"not delivered" with a retry button in the agent app</text>

  <rect x="480" y="714" width="340" height="104" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="10"/>
  <text x="492" y="736" font-size="14" font-weight="700" fill="#0f172a">Background jobs</text>
  <text x="492" y="756" font-size="12" fill="#334155">re-embed knowledge when an entry changes</text>
  <text x="492" y="772" font-size="12" fill="#334155">nightly evaluation run and cross-brand leak check</text>
  <text x="492" y="788" font-size="12" fill="#334155">daily cost roll-up per brand and model</text>
  <text x="492" y="804" font-size="12" fill="#334155">archive old data</text>

  <rect x="860" y="714" width="360" height="104" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.2" rx="10"/>
  <text x="872" y="736" font-size="14" font-weight="700" fill="#0f172a">Monitoring</text>
  <text x="872" y="756" font-size="12" fill="#334155">logs, metrics and traces with brand_id on each</text>
  <text x="872" y="772" font-size="12" fill="#334155">queue lag, provider timeouts, model latency and cost</text>
  <text x="872" y="788" font-size="12" fill="#334155">approval rate, edit rate and flag rate per brand</text>
  <text x="872" y="804" font-size="12" fill="#334155">alerts on cost and quality changes</text>

  <!-- Flows -->
  <path d="M 170 152 L 170 216" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 152 L 400 170 L 250 170 L 250 216" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 320 255 L 360 255" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 560 255 L 600 255" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 750 294 L 750 316 L 360 316 L 360 570" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="366" y="352" font-size="11" fill="#475569">save message</text>
  <path d="M 1120 152 L 1120 216" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1080 294 L 1080 312 L 200 312 L 200 360" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="930" y="308" font-size="11" fill="#475569">HTTPS with the agent's token</text>
  <path d="M 340 430 L 380 430" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="342" y="422" font-size="11" font-weight="700" fill="#4f46e5">generate</text>
  <path d="M 700 420 L 740 420" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 970 400 L 1010 400" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 1115 360 L 1115 326 L 920 326 L 920 152" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="930" y="342" font-size="11" fill="#475569">chat completions</text>
  <path d="M 855 500 L 855 526 L 590 526 L 590 570" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 540 500 L 540 526 L 380 526 L 380 570" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="548" y="522" font-size="11" fill="#475569">draft + context</text>
  <path d="M 300 360 L 300 322 L 580 322 L 580 152" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="306" y="334" font-size="11" fill="#475569">order facts (cached)</text>
  <path d="M 150 648 L 150 714" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="158" y="686" font-size="11" fill="#475569">outbox rows</text>
  <path d="M 60 766 L 48 766 L 48 131 L 60 131" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 590 714 L 590 648" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="598" y="686" font-size="11" fill="#475569">re-embed on save</text>
  <path d="M 850 648 L 850 670 L 920 670 L 920 714" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
